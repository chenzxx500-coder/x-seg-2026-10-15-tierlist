<body>
<p>你的手机里可能装着三个 AI：ChatGPT、Claude、Gemini。每次要问问题，先纠结一分钟该打开哪个——这不是你的问题，是选工具的姿势错了。</p>
<p>专门做 AI 实测的频道 AIIQ 在 10 月 14 日刚发布了一个视频，干了一件实在事：不辩论"谁最强"，而是把一周的真实工作拆成 8 类任务，让 Claude（付费版）、ChatGPT（免登录免费版）、Gemini（默认 Auto 模式）逐项同场实测，最后按 S 到 C 排了一张分工表，还给了一套"从零开始的免费组合"。</p>
<p>我看完最大的感受：选 AI 根本不是选美比赛，而是排班。排对了班，免费版也能打出付费的效果。</p>
</body></html>
