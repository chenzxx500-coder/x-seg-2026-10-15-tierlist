<h2>二、写长东西：让 Claude 先搭骨架</h2>
<p>在"写脚本和长内容"这一项，Claude 是公认的舒适区：长文本结构完整、语气前后一致、不容易写着写着跑偏。做过自媒体的都懂，AI 写长文最难的不是字数，是"后半段还记得前半段说了什么"。</p>
<p>我的用法是"骨架 AI 写，血肉自己填"：先让它出大纲和初稿，解决从 0 到 60 分的问题；剩下的 40 分——观点、例子、语气——必须自己动手。因为 AI 写作真正的坑不是"写得差"，而是"写得像 AI"：结构工整、用词正确、读完什么也没记住。最后那遍个性化改写，才是你的护城河。</p>
